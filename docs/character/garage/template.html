<!doctype html>
<!-- 내 차 꾸미기 3D 차고 (앱 안 WebView). 이 파일은 docs/character/garage/build.js가 만든다. 직접 고치지 말 것 -->
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>garage</title>
<style>
/* 레이아웃: 왼쪽 360도 차고(3D), 오른쪽 꾸미기 패널. 좁은 창(앱 2개 띄움)이면 위아래로. 차량 화면이라 글자·터치 영역을 크게.
   색은 앱(Theme.kt)과 같은 Pleos 디자인 가이드 값 */
:root {
  --bg: #F7F8FA; --panel: #FFFFFF; --ink: #131417; --muted: rgba(19,20,23,.64); --line: #E0E1E6;
  --accent: #131417; --accent-ink: #FFFFFF; --chip: #EDEEF2; --warn: #FF8A00; --stage: #EDEEF2;
  --font: "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
}
/* 밤 모드: 앱(Theme.kt DarkColors)과 같은 값 */
html.dark {
  --bg: #1D1E21; --panel: #313236; --ink: #FFFFFF; --muted: rgba(255,255,255,.64); --line: #44464E;
  --accent: #FFFFFF; --accent-ink: #131417; --chip: #44464E; --warn: #FF8A00; --stage: #26272B;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 20px; -webkit-user-select: none; user-select: none; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 520px; gap: 1px; height: 100%; box-sizing: border-box; background: var(--line); }
.stage { position: relative; background: var(--stage); overflow: hidden; min-height: 0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 28px; top: 24px; right: 28px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.hud h1 { font-weight: 700; font-size: 38px; margin: 0; line-height: 1.15; }
.hud .sub { color: var(--muted); font-size: 21px; margin-top: 6px; }
.hud .tools { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
.hint { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); color: var(--muted); font-size: 18px; white-space: nowrap; }
button { font: inherit; cursor: pointer; }
button.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 10px 20px; font-size: 19px; min-height: 56px; }
button.ghost[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; padding: 0; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: none; border-bottom: 4px solid transparent; padding: 20px 2px 16px; font-weight: 700; font-size: 19px; color: var(--muted); white-space: nowrap; letter-spacing: -0.02em; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.body { overflow: auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 26px; min-height: 0; flex: 1; }
.group h3 { margin: 0 0 10px; font-size: 20px; color: var(--muted); font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 10px 16px; font-size: 19px; min-height: 60px; display: inline-flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; }
.opt .row { display: inline-flex; align-items: center; gap: 8px; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.opt[disabled] { background: var(--chip); color: var(--muted); cursor: default; }
.opt.swatch { padding: 6px; min-height: 0; }
.opt.swatch .sw { width: 54px; height: 54px; border-radius: 6px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); flex: none; }
.lock { font-size: 15px; color: var(--warn); }
input[type=text] { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 14px 16px; font: inherit; font-size: 22px; -webkit-user-select: text; user-select: text; }
.palette { position: absolute; inset: 0; background: var(--panel); z-index: 5; display: flex; flex-direction: column; padding: 20px 24px; gap: 14px; }
.palette h3 { margin: 0; font-size: 22px; }
.palette .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
.palette .grid button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px; min-height: 0; padding: 0; }
.palette .grid button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.palette .row { display: flex; align-items: center; gap: 14px; font-size: 19px; color: var(--muted); }
.palette input[type=range] { flex: 1; height: 48px; }
.palette .preview { width: 72px; height: 72px; border-radius: 8px; border: 1px solid var(--line); }
.opt.swatch.custom .sw { background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935); }
.note { color: var(--muted); font-size: 17px; line-height: 1.6; }
.actions { display: flex; gap: 12px; padding: 16px 24px 24px; border-top: 1px solid var(--line); }
.actions button { flex: 1; min-height: 72px; border-radius: 8px; font-size: 22px; font-weight: 700; }
.actions .cancel { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.actions .primary { background: var(--accent); color: var(--accent-ink); border: none; }
.saving { position: fixed; inset: 0; background: rgba(247,248,250,.85); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
html.dark .saving { background: rgba(29,30,33,.85); }
@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 45%) minmax(0, 55%); }
}
</style></head><body>
<div class="app">
  <section class="stage" id="stage">
    <div class="hud">
      <div>
        <h1 id="nameTitle"></h1>
        <div class="sub" id="subTitle"></div>
      </div>
      <div class="tools">
        <button class="ghost" id="spin" aria-pressed="true"></button>
        <button class="ghost" id="front"></button>
        <button class="ghost" id="side"></button>
        <button class="ghost" id="top"></button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="body" id="body"></div>
    <div class="actions">
      <button class="cancel" id="cancelBtn"></button>
      <button class="primary" id="saveBtn"></button>
    </div>
  </aside>
</div>
<div class="saving" id="saving" hidden></div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
// 표정 8종(볼터치 없는 SVG data URI). build.js가 layers.js에서 넣는다
const FACES = /*FACES*/{};
// 색 팔레트 id → { hex, name, finish }. build.js가 docs/character/car3d/palette.py에서 넣는다
const PALETTE = /*PALETTE*/{};
// 옆면 데칼 그림(SVG data URI). 가로 = 차 길이(앞→뒤), 세로 = 바닥→지붕. build.js가 garage/decals/*.svg에서 넣는다
const DECALS = /*DECALS*/{};

// 앱(Kotlin GarageBridge)이 넘겨주는 값: 문구(strings.xml), 칸별 항목·잠김(두뇌 층 CustomizationRules), 저장된 선택, 지금 표정, 종족.
// 항목·잠김 판정은 앱이 한다. 이 페이지는 그리기만 한다
const APP = window.NaechamonApp;
const INIT = JSON.parse(APP ? APP.initialState() : '{"labels":{},"slots":{},"state":{},"face":"face_happy","species":"squirrel","faces":[],"nameMax":10}');
const T = (k) => INIT.labels[k] || '';
if (INIT.dark) document.documentElement.classList.add('dark');
const COLORS = {}; for (const [k, v] of Object.entries(PALETTE)) COLORS[k] = '#' + v.hex;
// 탭 → 칸 배치 (화면 배치만 여기서 정한다)
const TABS = { basic: ['name', 'plate', 'fuel', 'shape'], paint: ['color', 'finish', 'roof', 'decal', 'stripe', 'sticker'], wheel: ['wheelStyle', 'wheelColor', 'headLamp', 'tailLamp', 'lamp', 'wheelSize'], acc: ['head', 'roofAcc', 'roofTop', 'rear', 'glasses', 'blush'], tune: ['frontBumper', 'rearBumper', 'exhaust', 'side', 'grille', 'hood', 'fender', 'trim'] };
TABS.wheel.splice(2, 0, 'caliper', 'tireLetter');
TABS.wheel.splice(TABS.wheel.indexOf('wheelColor') + 1, 0, 'wheelFinish');
TABS.wheel.push('lampHousing', 'rideHeight');
TABS.acc.splice(TABS.acc.indexOf('roofTop') + 1, 0, 'antenna', 'glassTint');
TABS.parts = ['color', 'roof', 'mirrorColor', 'frontPartColor', 'sidePartColor', 'rearPartColor', 'fenderPartColor', 'hoodPartColor', 'grilleColor', 'stripeColor', 'wheelColor', 'caliper'];
const DEFAULTS = { shape: 'sedan_m', color: 'white', finish: 'gloss', roof: 'none', decal: 'none', stripe: 'none', sticker: 'none', wheelStyle: 'aero', wheelColor: 'silver', lamp: 'white', headLamp: 'slim', tailLamp: 'split', wheelSize: 'm', head: 'none', roofAcc: 'none', rear: 'none', glasses: 'none', blush: 'off', fuel: 'gas', frontBumper: 'base', rearBumper: 'base', exhaust: 'base', side: 'base', grille: 'base', hood: 'base', fender: 'base', trim: 'base', caliper: 'base', tireLetter: 'off', roofTop: 'base', mirrorColor: 'base', frontPartColor: 'base', sidePartColor: 'base', rearPartColor: 'base', fenderPartColor: 'base', hoodPartColor: 'base', grilleColor: 'base', stripeColor: 'base', wheelFinish: 'gloss', glassTint: 'base', antenna: 'none', rideHeight: 'base', lampHousing: 'base' };
const isHex = (v) => typeof v === 'string' && /^#[0-9A-Fa-f]{6}$/.test(v);
// 미리 정한 이름 색 (부품 색 칸) → 색 값
const NAMED = { white: '#F2F3F5', black: '#16181B', silver: '#B9BEC4', red: '#C8241C', yellow: '#E2B419', blue: '#2F62C8', gold: '#D9B35A', gunmetal: '#5A5F66', bronze: '#A07A4A' };
// 차급에 안 맞는 튜닝은 비슷한 부품으로 바꿔 그린다 (승용·경차의 사이드 스텝 → 스커트, 아웃도어 범퍼 → 립, 경차 가운데 배기 → 양쪽)
const FIT = { sedan: { side: { step: 'skirt' }, frontBumper: { outdoor: 'lip' } }, mini: { side: { step: 'skirt' }, frontBumper: { outdoor: 'lip' }, exhaust: { center: 'dual' } } };
const kindOf = (shape) => shape.startsWith('suv') ? 'suv' : shape === 'mini' ? 'mini' : 'sedan';
const fit = (key) => { const v = state[key] || DEFAULTS[key]; return ((FIT[kindOf(state.shape)] || {})[key] || {})[v] || v; };
// 메시 부품 꼬리표 앞머리 → 칸 (f:split, gr:mesh …)
const PARTKEY = { fb: 'frontPartColor', sd: 'sidePartColor', rb: 'rearPartColor', fd: 'fenderPartColor', hd: 'hoodPartColor', gr: 'grilleColor' };
const PAINTABLE = new Set(['piano', 'trim', 'skid', 'paint', 'chrome', 'carbon']);
const TAGKEY = { f: 'headLamp', r: 'tailLamp', gr: 'grille', fb: 'frontBumper', rb: 'rearBumper', sd: 'side', hd: 'hood', fd: 'fender' };
const state = Object.assign({ name: '', plate: '' }, DEFAULTS, INIT.state, { face: INIT.face, species: INIT.species });

// ---------- 패널 ----------
const tabsEl = document.getElementById('tabs'), bodyEl = document.getElementById('body');
let tab = 'basic';
function renderTabs() {
  tabsEl.innerHTML = '';
  for (const k of Object.keys(TABS)) {
    const b = document.createElement('button'); b.textContent = T('tab_' + k); b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', k === tab); b.onclick = () => { tab = k; renderTabs(); renderBody(); }; tabsEl.appendChild(b);
  }
}
function optBtn(o, pressed, onClick, swatch) {
  const b = document.createElement('button'); b.className = 'opt'; b.setAttribute('aria-pressed', pressed);
  const row = document.createElement('span'); row.className = 'row';
  if (swatch) { b.classList.add('swatch'); b.title = o.label; const s = document.createElement('span'); s.className = 'sw'; s.style.background = swatch; row.appendChild(s); }
  else row.appendChild(document.createTextNode(o.label));
  b.appendChild(row);
  if (o.locked) { b.disabled = true; const l = document.createElement('span'); l.className = 'lock'; l.textContent = o.how; b.appendChild(l); }
  else b.onclick = onClick;
  return b;
}
function renderBody() {
  bodyEl.innerHTML = '';
  for (const key of TABS[tab]) {
    const wrap = document.createElement('div'); wrap.className = 'group';
    const h = document.createElement('h3'); wrap.appendChild(h);
    if (key === 'name' || key === 'plate') {
      h.textContent = T('slot_' + key);
      const i = document.createElement('input'); i.type = 'text'; i.value = state[key]; i.maxLength = INIT.nameMax;
      i.oninput = () => { state[key] = i.value; update(); }; wrap.appendChild(i);
    } else {
      const slot = INIT.slots[key]; if (!slot) continue;
      const colored = key === 'color' || key === 'roof';
      const cur = slot.options.find(o => o.id === state[key]);
      h.textContent = slot.title + (colored && cur && cur.id !== 'none' ? ' · ' + cur.label : '') + (isHex(state[key]) ? ' · ' + T('custom_color') : '');
      const opts = document.createElement('div'); opts.className = 'opts';
      for (const o of slot.options) opts.appendChild(optBtn(o, state[key] === o.id, () => set(key, o.id), colored && o.id !== 'none' ? COLORS[o.id] : null));
      // 팔레트를 받는 칸: 직접 고른 색 견본 + "직접 고르기"
      if (slot.custom) {
        if (isHex(state[key])) opts.appendChild(optBtn({ label: state[key] }, true, () => openPalette(key), state[key]));
        const pb = optBtn({ label: T('pick_color'), locked: slot.custom.locked, how: slot.custom.how }, false, () => openPalette(key), null);
        opts.appendChild(pb);
      }
      wrap.appendChild(opts);
    }
    bodyEl.appendChild(wrap);
  }
  const n = document.createElement('div'); n.className = 'note'; n.textContent = T('note'); bodyEl.appendChild(n);
}
function set(k, v) { state[k] = v; renderBody(); update(); }
// 팔레트: 색상 12 × 밝기 6 + 무채색 줄, 아래 밝기 막대로 고른 색을 미세 조정. 고르면 바로 3D에 보이고 닫으면 패널로 돌아간다
const hsl2hex = (h, s_, l) => { s_ /= 100; l /= 100; const k = (n) => (n + h / 30) % 12, a = s_ * Math.min(l, 1 - l);
  const c = (n) => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, '0'); return ('#' + c(0) + c(8) + c(4)).toUpperCase(); };
function openPalette(key) {
  const old = document.querySelector('.palette'); if (old) old.remove();
  const p = document.createElement('div'); p.className = 'palette';
  const h = document.createElement('h3'); h.textContent = T('palette_title') + ' · ' + (INIT.slots[key] ? INIT.slots[key].title : ''); p.appendChild(h);
  let base = isHex(state[key]) ? state[key] : '#2F62C8', light = 0;
  const grid = document.createElement('div'); grid.className = 'grid';
  const cells = [];
  for (const l of [82, 68, 55, 44, 34, 24]) for (let i = 0; i < 12; i++) cells.push(hsl2hex(i * 30, l > 70 ? 55 : 68, l));
  for (let i = 0; i < 12; i++) cells.push(hsl2hex(0, 0, 96 - i * 8));
  const adj = (hex, d) => { const n = parseInt(hex.slice(1), 16), ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(d > 0 ? v + (255 - v) * d : v * (1 + d)))));
    return '#' + ch.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase(); };
  const preview = document.createElement('div'); preview.className = 'preview';
  const apply = () => { const v = adj(base, light); preview.style.background = v; state[key] = v; update(); };
  for (const c of cells) { const b = document.createElement('button'); b.style.background = c; b.setAttribute('aria-pressed', c === base);
    b.onclick = () => { base = c; light = 0; slider.value = 0; grid.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); apply(); }; grid.appendChild(b); }
  p.appendChild(grid);
  const row = document.createElement('div'); row.className = 'row'; row.appendChild(document.createTextNode(T('palette_light')));
  const slider = document.createElement('input'); slider.type = 'range'; slider.min = -60; slider.max = 60; slider.value = 0;
  slider.oninput = () => { light = slider.value / 100; apply(); }; row.appendChild(slider); row.appendChild(preview); p.appendChild(row);
  const done = document.createElement('button'); done.className = 'ghost'; done.textContent = T('cancel') ? '✓' : 'OK';
  done.onclick = () => { p.remove(); renderBody(); }; row.appendChild(done);
  preview.style.background = base;
  document.querySelector('.panel').style.position = 'relative'; document.querySelector('.panel').appendChild(p);
  if (!isHex(state[key])) apply();
}

// ---------- 3D ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.physicallyCorrectLights = true;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(6.4, 2.6, 7.2);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0); controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 5; controls.maxDistance = 22; controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true; controls.autoRotateSpeed = 1.2;

// 스튜디오 환경광: 파일 없이 페이지 안에서 만든다. 밝기 범위가 넓은(HDR) 값으로 채워야 도장 하이라이트가 또렷하다.
// 어두운 바닥·회색 벽 + 아주 밝은 천장 소프트박스와 옆 띠 조명. 밤에는 전체를 어둡게 한 환경을 쓴다
function studioEnv(gain) {
  const w = 256, h = 128, data = new Float32Array(w * h * 4);
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const band = (x, lo, hi, e) => ss(lo - e, lo + e, x) * (1 - ss(hi - e, hi + e, x));
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const u = i / w, v = j / h;                       // v: 0 바닥 → 1 천장
    let L = v < 0.42 ? 0.04 : v < 0.5 ? 0.04 + (v - 0.42) / 0.08 * 0.36 : 0.18 + (v - 0.5) * 0.3;
    L += 10 * band(v, 0.80, 0.97, 0.02) * band(u, 0.12, 0.62, 0.03);   // 천장 큰 소프트박스 (키)
    L += 6 * band(v, 0.52, 0.74, 0.02) * (band(u, 0.04, 0.10, 0.01) + band(u, 0.64, 0.71, 0.01));   // 옆 띠 조명 두 개
    L += 2 * band(v, 0.495, 0.525, 0.008);                              // 지평선 띠 (옆면 하이라이트 선)
    const k = (j * w + i) * 4; data[k] = L * gain; data[k + 1] = L * gain; data[k + 2] = L * 1.03 * gain; data[k + 3] = 1;
  }
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.LinearEncoding; t.magFilter = t.minFilter = THREE.NearestFilter; t.needsUpdate = true;
  const pm = new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader();
  const env = pm.fromEquirectangular(t).texture; pm.dispose(); t.dispose(); return env;
}
// 실수 텍스처를 못 쓰는 기기용 대체 환경(8비트 캔버스)
function studioEnvLdr() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 512);
  sky.addColorStop(0, '#3A3D42'); sky.addColorStop(0.47, '#6F7378'); sky.addColorStop(0.5, '#9A9DA2'); sky.addColorStop(0.53, '#4A4D52'); sky.addColorStop(1, '#141517');
  g.fillStyle = sky; g.fillRect(0, 0, 1024, 512);
  g.fillStyle = '#fff'; g.fillRect(80, 60, 420, 90); g.fillRect(620, 90, 200, 110); g.fillRect(0, 0, 1024, 28); g.fillRect(0, 236, 1024, 14);
  const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader();
  const env = pm.fromEquirectangular(t).texture; pm.dispose(); t.dispose(); return env;
}
const ENV = {};
function envFor(night) {
  const key = night ? 'night' : 'day';
  if (!ENV[key]) { try { ENV[key] = studioEnv(night ? 0.32 : 1.0); } catch (e) { console.warn('env fallback', e); ENV[key] = ENV.ldr || (ENV.ldr = studioEnvLdr()); } }

let pending = false;

const spinBtn = document.getElementById('spin');

// 정면·측면·위 보기: 차 전체가 화면(가로·세로 중 좁은 쪽)에 들어오는 거리로 맞춘다

// ---------- 저장 ----------
// 선택을 앱에 넘기고, 표정마다 정지 그림(3/4 앞모습, 투명 배경)을 찍어 넘긴다.

const facesReady = Promise.all(Object.values(faceImgs).map(im => im.complete ? null : new Promise(r => { im.addEventListener('load', r); im.addEventListener('error', r); })));

async function snapshotAll(sink, night) {
  await facesReady;

    // 차는 낮/밤마다 한 번만 짓고, 표정마다 앞유리 그림만 바꿔 그린다 (모양·구도는 표정과 상관없다)

async function saveAll() {

    // 앱은 선택과 그림을 임시로 들고 있다가 done()에서 다 모였을 때만 한 번에 바꾼다
